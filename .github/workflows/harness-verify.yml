# harness-kit: задача CI harness-verify (уровень 0) — запускает verify на каждом изменении.
# Файл принадлежит harness: его заменяют `harness-kit upgrade` и `sync`, удаляет `uninstall`;
# ручная правка будет найдена по хешу из журнала harness/ledger.json. Свои задачи держите в
# своих файлах CI. Имя задачи harness-verify стабильно: с уровня 2 это обязательная проверка.
name: harness-verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Очередь слияния присылает своё событие: без него обязательная проверка в ней не придёт.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-verify:
    name: harness-verify
    runs-on: ubuntu-latest
    # verify ограничивает каждую проверку сам; предел задачи ловит зависшую установку.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: scripts/verify

  # Собственный ревьюер harness: после зелёного CI ревьюит изменение PR и пишет находки и
  # вердикт комментарием. Секрет ревьюера есть только у шага ревью, токен хостинга — только
  # у шагов ожидания и публикации. Черновики, форки и красный CI рантайм пропускает сам.
  harness-review:
    name: harness-review
    needs: harness-verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Ожидание CI (срок ворот), по два запуска поиска и проверки, тесты воспроизведения, установка исполнителя.
    timeout-minutes: 80
    permissions:
      contents: read
      checks: read
      pull-requests: write
      # Записи ночного прогона (issue harness:nightly) — для бюджетов суток и месяца.
      issues: read
      # Перезапуск проваленных ворот после вердикта.
      actions: write
    outputs:
      reproduce: ${{ steps.review.outputs.reproduce }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: wait
        run: exec node harness/core/runtime.mjs review-ci wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARNESS_REVIEWER_SECRET_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HARNESS_JOB_TIMEOUT_MINUTES: "80"
      - if: steps.wait.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - id: review
        if: steps.wait.outputs.run == 'true'
        run: exec node harness/core/runtime.mjs review --depth risk --place pr --base "$HARNESS_BASE" --since "$HARNESS_SINCE" --out "$RUNNER_TEMP/harness-review.json"
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
          HARNESS_SINCE: ${{ steps.wait.outputs.since }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: ${{ !cancelled() && steps.wait.outputs.run == 'true' && steps.review.outputs.reproduce != 'true' }}
        run: exec node harness/core/runtime.mjs review-ci publish --report "$RUNNER_TEMP/harness-review.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ !cancelled() && steps.review.outputs.reproduce == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-review-report
          path: ${{ runner.temp }}/harness-review.json
          retention-days: 1
          overwrite: true

  # Тесты воспроизведения: в отдельной задаче без секретов и с токеном только на чтение.
  harness-review-reproduce:
    name: harness-review-reproduce
    needs: harness-review
    if: ${{ !cancelled() && needs.harness-review.outputs.reproduce == 'true' }}
    runs-on: ubuntu-latest
    # Тесты без новых файлов и с каждым тестом, установка зависимостей проекта.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harness-review-report
          path: ${{ runner.temp }}/harness-review-report
      - run: exec node harness/core/runtime.mjs review-reproduce --report "$RUNNER_TEMP/harness-review-report/harness-review.json" --base "$HARNESS_BASE" --pending
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: exec node harness/core/runtime.mjs review-reproduce --report "$RUNNER_TEMP/harness-review-report/harness-review.json" --base "$HARNESS_BASE" --out "$RUNNER_TEMP/harness-review.json"
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-review-reproduce-report
          path: ${{ runner.temp }}/harness-review.json
          retention-days: 1
          overwrite: true

  # Публикация итога с тестами: токен с правом писать в PR — только здесь, без кода тестов.
  harness-review-publish:
    name: harness-review-publish
    needs: [harness-review, harness-review-reproduce]
    if: ${{ !cancelled() && needs.harness-review.outputs.reproduce == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: harness-review-report
          path: ${{ runner.temp }}/harness-review-report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: harness-review-reproduce-report
          path: ${{ runner.temp }}/harness-review-reproduce-report
      - run: |
          report="$RUNNER_TEMP/harness-review-reproduce-report/harness-review.json"
          if [ ! -f "$report" ]; then report="$RUNNER_TEMP/harness-review-report/harness-review.json"; fi
          exec node harness/core/runtime.mjs review-ci publish --report "$report"
        env:
          GITHUB_TOKEN: ${{ github.token }}
