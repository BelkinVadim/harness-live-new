# harness-kit: задача harness-review-nightly (ночной прогон ревьюера, уровень 1) — ревьюит код,
# влитый в ветку по умолчанию с прошлой ночи; находки — issue с меткой harness:pre-existing.
# Файл принадлежит harness: его заменяют `harness-kit upgrade` и `sync`, удаляют `uninstall` и
# `detach`; ручная правка будет найдена по хешу из журнала harness/ledger.json.
name: harness-review-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-review-nightly
  cancel-in-progress: false

jobs:
  harness-review-nightly:
    name: harness-review-nightly
    runs-on: ubuntu-latest
    # План, по два запуска поиска и проверки, установка исполнителя и публикация.
    timeout-minutes: 60
    permissions:
      contents: read
      # Находки и записи прогонов — issue.
      issues: write
      # Расход задач на PR для бюджетов суток и месяца.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: plan
        run: exec node harness/core/runtime.mjs review-nightly plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.plan.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - id: review
        if: steps.plan.outputs.run == 'true'
        run: exec node harness/core/runtime.mjs review --depth risk-2 --place nightly --base "$HARNESS_BASE" --out "$RUNNER_TEMP/harness-review-nightly.json"
        env:
          HARNESS_BASE: ${{ steps.plan.outputs.base }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        run: exec node harness/core/runtime.mjs review-nightly publish --report "$RUNNER_TEMP/harness-review-nightly.json" --base "$HARNESS_BASE"
        env:
          HARNESS_BASE: ${{ steps.plan.outputs.base }}
          GITHUB_TOKEN: ${{ github.token }}
